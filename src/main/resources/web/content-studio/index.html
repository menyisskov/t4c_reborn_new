<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>T4C Content Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/app.css">
  </head>
  <body>
    <div class="studio-shell">
      <aside class="studio-sidebar">
        <div class="brand-block">
          <span class="brand-mark">T4C</span>
          <div>
            <h1>T4C Content Studio</h1>
            <p>Admin dashboard</p>
          </div>
        </div>
        <nav id="sectionNav" class="section-nav"></nav>
      </aside>

      <main class="studio-main">
        <header class="topbar">
          <div>
            <p id="sectionEyebrow" class="eyebrow">Sprites</p>
            <h2 id="sectionTitle">Sprites</h2>
          </div>
          <div class="topbar-actions">
            <label id="spriteBinPicker" class="map-picker hidden">
              <span>Sprite Bin</span>
              <select id="spriteBinSelect" class="form-select form-select-sm"></select>
            </label>
            <label class="map-picker">
              <span>Map</span>
              <select id="mapSelect" class="form-select form-select-sm"></select>
            </label>
            <button id="reloadBtn" class="btn btn-outline-dark btn-sm">Reload</button>
            <button id="saveBtn" class="btn btn-dark btn-sm">Save</button>
          </div>
        </header>

        <section class="stats-row">
          <div class="stat-card">
            <span>Records</span>
            <strong id="recordCount">0</strong>
          </div>
          <div class="stat-card">
            <span>Selected</span>
            <strong id="selectedLabel">None</strong>
          </div>
          <div class="stat-card">
            <span>Status</span>
            <strong id="statusText">Ready</strong>
          </div>
        </section>

        <section id="dataWorkspace" class="workspace">
          <div class="table-panel">
            <div class="panel-toolbar">
              <input id="filterInput" class="form-control form-control-sm" placeholder="Filter records...">
              <div class="button-row">
                <button id="newBtn" class="btn btn-outline-dark btn-sm">New</button>
                <button id="duplicateBtn" class="btn btn-outline-dark btn-sm">Duplicate</button>
                <button id="deleteBtn" class="btn btn-danger btn-sm">Delete</button>
              </div>
            </div>
            <div id="recordList" class="record-list"></div>
          </div>

          <div class="editor-panel">
            <div class="editor-header">
              <h3 id="editorTitle">No record selected</h3>
              <span id="dirtyBadge" class="dirty-badge hidden">Unsaved</span>
            </div>
            <div id="editorTabs" class="editor-tabs hidden" role="tablist">
              <button type="button" class="editor-tab is-active" data-tab="details" role="tab">Details</button>
              <button type="button" class="editor-tab" data-tab="dialogue" role="tab">Dialogue graph</button>
            </div>
            <div id="editorTabDetails" class="editor-tab-panel">
            <div id="entityPreview" class="entity-preview hidden">
              <div class="entity-preview-stage">
                <img id="entityPreviewImage" alt="Record preview">
                <div id="entityPreviewComposite" class="entity-preview-composite hidden"></div>
                <span id="entityPreviewPlaceholder">No preview</span>
              </div>
              <div>
                <span class="field-label">Preview</span>
                <strong id="entityPreviewTitle">No sprite resolved</strong>
                <p id="entityPreviewHint" class="muted mono mb-0"></p>
              </div>
            </div>
            <div id="formFields" class="form-grid"></div>
            <div id="relationEditorBlock" class="relation-editor hidden"></div>
            <div id="jsonEditorBlock" class="json-block hidden">
              <label class="field-label" for="jsonEditor">Advanced JSON</label>
              <textarea id="jsonEditor" class="form-control mono" rows="14"></textarea>
            </div>
            <div id="placementPreview" class="placement-preview hidden">
              <div class="placement-preview-header">
                <span class="field-label">Map Preview</span>
                <strong id="placementPreviewTitle">Spawn positions</strong>
              </div>
              <div id="placementPreviewStage" class="placement-preview-stage">
                <img id="placementPreviewImage" alt="Placement map preview">
              </div>
            </div>
            </div>
            <div id="editorTabDialogue" class="editor-tab-panel hidden"></div>
          </div>
        </section>

        <section id="spriteWorkspace" class="workspace sprite-workspace hidden">
          <div class="table-panel">
            <div class="panel-toolbar">
              <input id="spriteFilterInput" class="form-control form-control-sm" placeholder="Filter sprites...">
              <div class="button-row">
                <button id="spriteExportBtn" class="btn btn-outline-dark btn-sm">Export</button>
                <button id="spriteDeleteBtn" class="btn btn-danger btn-sm">Delete</button>
              </div>
            </div>
            <div id="spriteList" class="record-list"></div>
            <div id="spritePager" class="pager-row">
              <button id="spritePrevBtn" class="btn btn-outline-dark btn-sm" type="button">Prev</button>
              <span id="spritePageLabel" class="mono muted">0-0 / 0</span>
              <button id="spriteNextBtn" class="btn btn-outline-dark btn-sm" type="button">Next</button>
            </div>
            <div id="uploadZone" class="upload-zone">
              <input id="fileInput" type="file" multiple accept=".png,.bmp">
              <span>Drop PNG/BMP files here</span>
            </div>
          </div>
          <div class="editor-panel">
            <div class="editor-header">
              <h3 id="spriteName">No sprite selected</h3>
              <span id="spriteMeta" class="mono muted"></span>
            </div>
            <div class="preview-stage">
              <img id="previewImage" alt="Sprite preview">
              <span id="previewPlaceholder">Select a sprite</span>
            </div>
            <div class="form-grid compact">
              <label><span class="field-label">Rename</span><input id="renameInput" class="form-control form-control-sm mono"></label>
              <label><span class="field-label">off1X</span><input id="off1xInput" class="form-control form-control-sm mono" type="number"></label>
              <label><span class="field-label">off1Y</span><input id="off1yInput" class="form-control form-control-sm mono" type="number"></label>
              <label><span class="field-label">off2X</span><input id="off2xInput" class="form-control form-control-sm mono" type="number"></label>
              <label><span class="field-label">off2Y</span><input id="off2yInput" class="form-control form-control-sm mono" type="number"></label>
            </div>
            <div class="button-row end">
              <button id="saveSpriteBtn" class="btn btn-dark btn-sm">Save Sprite</button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div id="pageLoader" class="page-loader hidden" aria-live="polite" aria-busy="true">
      <div class="loader-panel">
        <span class="loader-spinner"></span>
        <strong id="loaderText">Loading...</strong>
      </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-4">
      <div id="actionToast" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div id="toastBody" class="toast-body"></div>
          <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
