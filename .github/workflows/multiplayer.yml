name: Multiplayer foundation

on:
  push:
    branches: [main]
    paths:
      - 'multiplayer/**'
      - 'src/main/java/com/perso/T4C/combat/**'
      - 'src/main/java/com/perso/T4C/world/**'
      - 'src/main/java/com/perso/T4C/config/GameConstants.java'
      - 'src/main/java/com/perso/T4C/helper/BinaryIOUtils.java'
      - 'assets/maps/worldmap/worldmap.colbin'
      - 'assets/i18n/lang.json'
      - 'src/test/java/com/perso/T4C/world/**'
      - 'src/test/java/com/perso/T4C/combat/CombatResolverTest.java'
      - '.github/workflows/multiplayer.yml'
  pull_request:
    paths:
      - 'multiplayer/**'
      - 'src/main/java/com/perso/T4C/combat/**'
      - 'src/main/java/com/perso/T4C/world/**'
      - 'src/main/java/com/perso/T4C/config/GameConstants.java'
      - 'src/main/java/com/perso/T4C/helper/BinaryIOUtils.java'
      - 'assets/maps/worldmap/worldmap.colbin'
      - 'assets/i18n/lang.json'
      - 'src/test/java/com/perso/T4C/world/**'
      - 'src/test/java/com/perso/T4C/combat/CombatResolverTest.java'
      - '.github/workflows/multiplayer.yml'

permissions:
  contents: read

jobs:
  persistence:
    name: PostgreSQL persistence contracts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: t4c_test
          POSTGRES_USER: t4c_test
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U t4c_test -d t4c_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      T4C_DB_URL: jdbc:postgresql://127.0.0.1:5432/t4c_test?connectTimeout=5&socketTimeout=10
      T4C_DB_USER: t4c_test
      T4C_DB_PASSWORD: ephemeral-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify persistence against real PostgreSQL
        run: mvn -B -f multiplayer/pom.xml -Dtest=OnlineStoreTest -Dsurefire.failIfNoSpecifiedTests=false test
  headless:
    name: Headless build and lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify shared combat and server lifecycle
        run: mvn -B -f multiplayer/pom.xml verify
      - name: Run without game assets or a display
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          java -Djava.awt.headless=true -jar "$GITHUB_WORKSPACE/multiplayer/server/target/t4c-server.jar" --ticks 5
