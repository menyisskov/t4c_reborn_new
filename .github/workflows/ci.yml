name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sanity:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Just enough history to diff against the previous commit/PR base -
          # this repo's .git is large (binary sprite/map assets), so a full
          # fetch-depth: 0 here would be expensive on every run. If history
          # is ever insufficient, scripts/ci-select-tests.sh fails safe to
          # the full test suite rather than guessing.
          fetch-depth: 10

      - name: Select tests
        id: select
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: scripts/ci-select-tests.sh "$BASE_REF" "$HEAD_REF" >> "$GITHUB_OUTPUT"

      - name: Show CI plan
        run: |
          echo "skip: ${{ steps.select.outputs.skip }}"
          echo "test_mode: ${{ steps.select.outputs.test_mode }}"
          echo "reason: ${{ steps.select.outputs.reason }}"
          if [[ "${{ steps.select.outputs.test_mode }}" == "scoped" ]]; then
            echo "test classes: ${{ steps.select.outputs.test_classes }}"
          fi

      - name: Set up JDK 17
        if: steps.select.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile
        if: steps.select.outputs.skip != 'true'
        run: mvn -B -DskipTests compile

      - name: Test (full suite)
        if: steps.select.outputs.skip != 'true' && steps.select.outputs.test_mode == 'full'
        run: mvn -B test

      - name: Test (scoped)
        if: steps.select.outputs.skip != 'true' && steps.select.outputs.test_mode == 'scoped'
        run: mvn -B "-Dtest=${{ steps.select.outputs.test_classes }}" -DfailIfNoTests=false test

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
