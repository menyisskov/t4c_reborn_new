name: Update compendium

# Keeps compendium/data.js (and compendium/data/*.json) in sync with the live game
# registries after every change lands on main - see compendium/README.md for what this
# regenerates and why it can't be a pure function of the diff (the "is this new content"
# allow-lists in CompendiumExporter.java still need a human/agent edit when a genuinely new
# zone/monster/spell/npc/quest ships; this workflow keeps already-tracked content's stats,
# text and loot tables current automatically without anyone remembering to re-run the tool).

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  regenerate:
    name: Regenerate compendium data
    runs-on: ubuntu-latest
    # The bot's own commit below re-triggers this workflow on its next push; by the time
    # that run gets here, the data is already current so the diff step is a no-op - but
    # skip the compile/regenerate cycle entirely on that run rather than pay for a run that
    # can only ever produce "nothing to commit".
    if: "!contains(github.event.head_commit.message, '[skip compendium]')"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile
        run: mvn -B -DskipTests compile

      - name: Build runtime classpath
        run: mvn -B -q dependency:build-classpath -Dmdep.outputFile=/tmp/cp.txt

      - name: Regenerate compendium data
        run: java -cp "target/classes:$(cat /tmp/cp.txt)" com.perso.T4C.tools.CompendiumExporter compendium/data

      - name: Commit and push if the data changed
        run: |
          if git diff --quiet -- compendium/data compendium/data.js; then
            echo "compendium data already up to date, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compendium/data compendium/data.js
          git commit -m "chore: regenerate compendium data [skip compendium]" -m "Auto-generated by .github/workflows/compendium.yml from ${{ github.sha }}."
          git push origin HEAD:main
