name: Update compendium

# Keeps compendium/data.js (and compendium/data/*.json) in sync with the live game
# registries after every change lands on main - see compendium/README.md for what this
# regenerates and why it can't be a pure function of the diff (the "is this new content"
# allow-lists in CompendiumExporter.java still need a human/agent edit when a genuinely new
# zone/monster/spell/npc/quest ships; this workflow keeps already-tracked content's stats,
# text and loot tables current automatically without anyone remembering to re-run the tool).

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  regenerate:
    name: Regenerate compendium data
    runs-on: ubuntu-latest
    # The bot's own commit below re-triggers this workflow on its next push; by the time
    # that run gets here, the data is already current so the diff step is a no-op - but
    # skip the compile/regenerate cycle entirely on that run rather than pay for a run that
    # can only ever produce "nothing to commit".
    if: "!contains(github.event.head_commit.message, '[skip compendium]')"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # A prepared website snapshot may come from local game changes that have not
      # landed on main yet. Do not overwrite that snapshot with main's older game
      # definitions on a website-only push. Game-source pushes still regenerate.
      - name: Check whether game inputs changed
        id: source
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "regenerate=true" >> "$GITHUB_OUTPUT"
          else
            git cat-file -e "$BASE_SHA" 2>/dev/null || git fetch --depth=1 origin "$BASE_SHA"
            if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- src/main assets pom.xml; then
              echo "regenerate=false" >> "$GITHUB_OUTPUT"
            else
              echo "regenerate=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up JDK 21
        if: steps.source.outputs.regenerate == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile
        if: steps.source.outputs.regenerate == 'true'
        run: mvn -B -DskipTests compile

      - name: Build runtime classpath
        if: steps.source.outputs.regenerate == 'true'
        run: mvn -B -q dependency:build-classpath -Dmdep.outputFile=/tmp/cp.txt

      - name: Regenerate zone map images
        if: steps.source.outputs.regenerate == 'true'
        run: java -cp "target/classes:$(cat /tmp/cp.txt)" com.perso.T4C.tools.MinimapExporter compendium/data

      - name: Regenerate monster portraits
        if: steps.source.outputs.regenerate == 'true'
        run: java -cp "target/classes:$(cat /tmp/cp.txt)" com.perso.T4C.tools.MonsterSpriteExporter compendium/data

      - name: Regenerate compendium data
        if: steps.source.outputs.regenerate == 'true'
        run: java -cp "target/classes:$(cat /tmp/cp.txt)" com.perso.T4C.tools.CompendiumExporter compendium/data

      - name: Stamp and verify reference snapshot
        run: |
          python3 scripts/compendium_freshness.py compendium
          python3 scripts/compendium_freshness.py compendium --check

      - name: Commit and push if the data changed
        run: |
          if git diff --quiet -- compendium; then
            echo "compendium data already up to date, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compendium
          git commit -m "chore: regenerate compendium data [skip compendium]" -m "Auto-generated by .github/workflows/compendium.yml from ${{ github.sha }}."
          git push origin HEAD:main
